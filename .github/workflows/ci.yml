name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test and vet Go transport
        run: |
          go test -race ./...
          go vet ./...

      - name: Compile and test COBOL registry and policy engine
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol
          set +e
          {
            cobc -x -free -Wall -I src -o /tmp/gamepage-builder src/gamepage.cob
            cobc -x -free -Wall -I src -o /tmp/gamepage-registry-builder src/gamepage_registry.cob
            cobc -x -free -Wall -I src -o /tmp/gamepage-core src/gamepage_core.cob
          } > /tmp/cobol-build.log 2>&1
          cobol_status=$?
          set -e
          cat /tmp/cobol-build.log
          if [ "$cobol_status" -ne 0 ]; then
            exit "$cobol_status"
          fi

          mkdir -p /tmp/gamepage-site/assets /tmp/gamepage-site/runtime
          (cd /tmp/gamepage-site && /tmp/gamepage-builder && /tmp/gamepage-registry-builder)
          test -s /tmp/gamepage-site/index.html
          test -s /tmp/gamepage-site/assets/styles.css
          test -s /tmp/gamepage-site/assets/status.js
          test -s /tmp/gamepage-site/runtime/routes.tsv
          test -s /tmp/gamepage-site/runtime/policy.tsv
          test -s /tmp/gamepage-site/runtime/architecture.json
          grep -q "COBOL Game Mainframe" /tmp/gamepage-site/index.html
          test "$(grep -c 'data-status="trump"' /tmp/gamepage-site/index.html)" -eq 1
          test "$(grep -c 'data-status="golf"' /tmp/gamepage-site/index.html)" -eq 1
          test "$(grep -c 'data-status="race"' /tmp/gamepage-site/index.html)" -eq 1
          grep -q 'TRUMP_ENABLED' /tmp/gamepage-site/runtime/routes.tsv
          grep -q 'MINIMUM_LAUNCHABLE_GAMES|1' /tmp/gamepage-site/runtime/policy.tsv
          grep -q 'canonicalRegistry' /tmp/gamepage-site/runtime/architecture.json
          grep -q 'policyState' /tmp/gamepage-site/assets/status.js

          cat > /tmp/status-healthy.in <<'STATUS'
          META|2026-07-14T10:00:00Z|false|
          GAME|trump|up|200|12||||
          GAME|golf|up|200|8||||
          GAME|race|up|200|15||||
          STATUS
          /tmp/gamepage-core /tmp/status-healthy.in /tmp/status-healthy.json

          cat > /tmp/status-optional-down.in <<'STATUS'
          META|2026-07-14T10:00:00Z|false|
          GAME|trump|up|200|12||||
          GAME|golf|down|503|8|http-error|true|false|
          GAME|race|up|200|15||||
          STATUS
          /tmp/gamepage-core /tmp/status-optional-down.in /tmp/status-optional-down.json

          cat > /tmp/status-required-down.in <<'STATUS'
          META|2026-07-14T10:00:00Z|false|
          GAME|trump|up|200|12||||
          GAME|golf|down|503|8|http-error|||
          GAME|race|up|200|15||||
          STATUS
          /tmp/gamepage-core /tmp/status-required-down.in /tmp/status-required-down.json

          cat > /tmp/status-slow.in <<'STATUS'
          META|2026-07-14T10:00:00Z|false|
          GAME|trump|up|200|12||||
          GAME|golf|up|200|8||||
          GAME|race|up|200|3000||||
          STATUS
          /tmp/gamepage-core /tmp/status-slow.in /tmp/status-slow.json

          cat > /tmp/status-disabled.in <<'STATUS'
          META|2026-07-14T10:00:00Z|false|
          GAME|trump|up|200|12||||
          GAME|golf|up|200|8||false|false|
          GAME|race|up|200|15||||
          STATUS
          /tmp/gamepage-core /tmp/status-disabled.in /tmp/status-disabled.json

          cat > /tmp/status-maintenance.in <<'STATUS'
          META|2026-07-14T10:00:00Z|true|
          GAME|trump|up|200|12||||
          GAME|golf|up|200|8||||
          GAME|race|up|200|15||||
          STATUS
          /tmp/gamepage-core /tmp/status-maintenance.in /tmp/status-maintenance.json

          cat > /tmp/status-invalid.in <<'STATUS'
          META|2026-07-14T10:00:00Z|false|
          GAME|trump|up|200|12||maybe||
          GAME|golf|up|200|8||||
          GAME|race|up|200|15||||
          STATUS
          /tmp/gamepage-core /tmp/status-invalid.in /tmp/status-invalid.json

          python3 - <<'PY'
          import json

          def load(name):
              with open(f'/tmp/status-{name}.json', encoding='utf-8') as handle:
                  return json.load(handle)

          healthy = load('healthy')
          assert healthy['overall'] == 'ok'
          assert healthy['ready'] is True
          assert healthy['decisionEngine'] == 'gnucobol'
          assert healthy['summary']['healthy'] == 3
          assert all(game['launchable'] for game in healthy['games'].values())
          assert all(game['required'] for game in healthy['games'].values())

          optional = load('optional-down')
          assert optional['overall'] == 'degraded'
          assert optional['ready'] is True
          assert optional['games']['golf']['policyState'] == 'down'
          assert optional['games']['golf']['required'] is False
          assert optional['games']['golf']['launchable'] is False

          required = load('required-down')
          assert required['overall'] == 'degraded'
          assert required['ready'] is False
          assert required['policy']['requiredFailures'] == 1

          slow = load('slow')
          assert slow['overall'] == 'degraded'
          assert slow['ready'] is False
          assert slow['games']['race']['policyState'] == 'slow'
          assert slow['games']['race']['launchable'] is True
          assert slow['games']['race']['reason'] == 'latency-threshold-exceeded'

          disabled = load('disabled')
          assert disabled['overall'] == 'degraded'
          assert disabled['ready'] is True
          assert disabled['games']['golf']['policyState'] == 'disabled'
          assert disabled['games']['golf']['launchable'] is False

          maintenance = load('maintenance')
          assert maintenance['overall'] == 'maintenance'
          assert maintenance['ready'] is False
          assert all(not game['launchable'] for game in maintenance['games'].values())

          invalid = load('invalid')
          assert invalid['overall'] == 'configuration-error'
          assert invalid['ready'] is False
          PY

      - name: Upload COBOL diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cobol-diagnostics
          path: |
            /tmp/cobol-build.log
            /tmp/status-*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build GamePage image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: game-page:ci
