# Install as /etc/apache2/sites-available/game.luisbenedikt.de.conf.
# This bootstrap vhost is intentionally HTTP-only so Certbot can create the
# final HTTPS vhost and redirect after DNS points to the server.
<VirtualHost *:80>
    ServerName game.luisbenedikt.de

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "http"

    # Preserve WebSocket upgrades through Apache and the Go gateway.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/(.*)$ ws://127.0.0.1:8090/$1 [P,L]

    ProxyPass        / http://127.0.0.1:8090/ connectiontimeout=5 timeout=90 retry=0
    ProxyPassReverse / http://127.0.0.1:8090/

    ErrorLog ${APACHE_LOG_DIR}/game.luisbenedikt.de-error.log
    CustomLog ${APACHE_LOG_DIR}/game.luisbenedikt.de-access.log combined
</VirtualHost>
